<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0059A3">
<meta name="robots" content="noindex, nofollow">
<title>Loans24 · Address verification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/v/styles.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <div class="row1">
      <div>
        <div class="step-label" id="stepLabel"></div>
        <div class="step-title" id="stepTitle"></div>
      </div>
      <div class="hdr-actions">
        <select id="langSelect" aria-label="Language"></select>
        <button class="listen-btn" id="listenBtn" type="button"><span aria-hidden="true">🔊</span> <span id="listenLabel"></span></button>
      </div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </header>
  <main class="screen-body" id="screenBody" aria-live="polite"></main>
  <footer class="btn-row" id="footer"></footer>
</div>
<noscript>Please enable JavaScript to continue.</noscript>
<script type="module" src="/v/app.js"></script>
</body>
</html>
