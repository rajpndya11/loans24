<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Verification review console</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<header class="top">
  <b>Loans24 · Verification review</b>
  <form id="authForm" class="auth">
    <input id="reviewer" placeholder="Your name" autocomplete="name" required>
    <input id="apiKey" type="password" placeholder="API key" autocomplete="off" required>
    <button type="submit">Connect</button>
  </form>
</header>

<div class="layout">
  <aside class="list">
    <div class="filters">
      <select id="statusFilter" aria-label="Status filter">
        <option value="review">Needs review</option>
        <option value="">All</option>
        <option value="accepted">Accepted</option>
        <option value="rejected">Rejected</option>
        <option value="agent_visit">Agent visit</option>
        <option value="created">Created</option>
        <option value="consented">In progress</option>
        <option value="expired">Expired</option>
      </select>
      <button id="refreshBtn" type="button">Refresh</button>
      <button id="newBtn" type="button">+ New</button>
    </div>
    <div id="sessionList" class="items"><p class="muted">Enter your name and API key to load sessions.</p></div>
  </aside>

  <main id="detail" class="detail"><p class="muted">Select a session.</p></main>
</div>

<dialog id="newDialog">
  <form id="newForm" method="dialog">
    <h3>Create verification session</h3>
    <label>Loan ID <input name="loanId" required></label>
    <label>Applicant name <input name="applicantName" required></label>
    <label>Business name (optional) <input name="businessName"></label>
    <label>House / flat / shop no. and building <input name="line1" required></label>
    <label>Area / locality <input name="area" required></label>
    <div class="row">
      <label>City <input name="city" required></label>
      <label>Pincode <input name="pincode" inputmode="numeric" maxlength="6" pattern="[1-9][0-9]{5}" required></label>
    </div>
    <div class="row">
      <label>Place type
        <select name="persona">
          <option value="salaried">Home</option>
          <option value="business">Shop / office</option>
          <option value="wfh">Home office (entrance only)</option>
        </select>
      </label>
      <label>Language
        <select name="lang">
          <option value="en">English</option><option value="hi">Hindi</option><option value="mr">Marathi</option>
          <option value="ta">Tamil</option><option value="te">Telugu</option>
        </select>
      </label>
    </div>
    <label class="inline"><input type="checkbox" name="assist"> Voice guidance + bigger text for the customer</label>
    <p id="newResult" class="mono"></p>
    <div class="row">
      <button value="cancel" formnovalidate type="submit">Close</button>
      <button id="createBtn" type="button" class="primary">Create link</button>
    </div>
  </form>
</dialog>

<script type="module" src="/admin/admin.js"></script>
</body>
</html>
